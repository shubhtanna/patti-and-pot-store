{% extends "base.html" %}
{% block title %}Search · Patti &amp; Pot{% endblock %}
{% block content %}
<section class="wrap">
  <h1 class="page">Search</h1>
  <form method="get" class="search"><input name="q" value="{{ q }}" placeholder="Search teas, regions or teaware"><button class="btn">Search</button></form>
  {% if q %}<p class="muted">{{ results|length }} result{{ results|length|pluralize }} for “{{ q }}”</p>{% endif %}
  <div class="grid">{% for p in results %}{% include "shop/_card.html" with p=p %}{% endfor %}</div>
</section>
{% endblock %}
